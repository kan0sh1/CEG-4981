<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Steal the Death Star Plans</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Navagation Bar -->
        <header>
            <nav class="navbar">
                <div class="logo">Rebel News</div>
                <!-- anchor links -->
                <ul class="nav-links">
                    <li><a href="#" id="homeLink"> Home </a></li>
                    <li><a href="#" id="photosLink"> Photos </a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">
            <!-- Section for videos -->
            <section id="home" class="section">
                <div class="card video-card">
                    <div class="video-header">
                        <h3 id="statusText">Current Feed</h3>
                    </div>

                    <div id="videoContainer" class="video-wrapper">
                        <!-- Video Player Container -->
                    </div>
                </div>
            </section>



            <!-- Section for Photos (will be hidden until selected from navbar)-->
            <section id="photos" class="section hidden">
                <div class="card photo-card">
                    <div class="card-header">
                        <h3>Transmitted Images</h3>
                    </div>
                <div id="imageGrid" class="image-grid">
                    <!-- 10 images will go in here -->
                </div>
                </div>
            </section>
        </main>



        <!-- Footer for Copyrights -->
        <footer>
            <p>&copy; 2026 Steal the Death Star Plans Project. Team 13. All rights reserved. </p>
        </footer>
    
        <!-- Link for Javascript -->
        <script src="script.js"></script>
    </body>
</html>
